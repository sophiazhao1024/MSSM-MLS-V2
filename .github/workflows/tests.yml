name: Software and saved-data checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: mssm-mls-modern --help
      - run: python tools/verify_benchmark_data.py
      # No external physics download/build/evaluation; not a performance proof.
